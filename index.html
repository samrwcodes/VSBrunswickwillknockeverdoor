<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ff4da6">
<title>Our Goal — Progress Thermometer</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#FFF;background:#111}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
.card{width:min(100%,440px);border:3px solid #111;padding:32px 25px;text-align:center;box-shadow:9px 9px 0 #ff4da6}
h1{font-size:clamp(28px,6vw,38px);font-weight:900;letter-spacing:-1.5px;text-transform:uppercase;margin:0 0 8px}
.subtitle{font-size:13px;letter-spacing:2px;text-transform:uppercase;margin:0 0 18px}
.pink{color:#ec238a}
svg{display:block;margin:10px auto 18px}
.number{font-size:30px;font-weight:900;letter-spacing:-1px}
.small{font-size:13px;font-weight:700;margin-top:7px}
.progress{height:12px;background:#000;border:2px solid #111;margin:22px 0 0;text-align:left}
.progress-fill{height:100%;background:#ff4da6;width:0}
.remaining{font-size:12px;margin-top:12px;font-weight:700}
</style>
</head>
<body>
<main class="card">
<h1>Knock Every Door Brunswick</h1>
<div class="subtitle">For the socialists (so better) <span class="pink">★</span></div>
<svg viewBox="0 0 120 270" width="120" height="270" role="img" aria-label="Goal progress thermometer">
<defs><clipPath id="tube"><rect x="44" y="12" width="32" height="188" rx="16"/></clipPath></defs>
<rect x="44" y="12" width="32" height="188" rx="16" fill="#fff" stroke="#111" stroke-width="4"/>
<rect id="fill" x="49" y="194" width="22" height="0" fill="#ff4da6" clip-path="url(#tube)"/>
<circle cx="60" cy="210" r="37" fill="#ff4da6" stroke="#111" stroke-width="4"/>
</svg>
<div class="number"><span id="current"></span> <span class="pink">/</span> <span id="targetText"></span></div>
<div class="small" id="percent"></div>
<div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="40000" aria-valuenow="21421" id="progress"><div class="progress-fill" id="progressFill"></div></div>
<div class="remaining" id="remaining"></div>
</main>
<script>
// OWNER SETTINGS: Edit these values in GitHub to update the public page.
const CURRENT_TOTAL = 21421;
const GOAL = 40000;
// END OWNER SETTINGS
const format = n => n.toLocaleString('en-AU');
const ratio = Math.min(1, Math.max(0, CURRENT_TOTAL / GOAL));
document.getElementById('current').textContent = format(CURRENT_TOTAL);
document.getElementById('targetText').textContent = format(GOAL);
document.getElementById('percent').textContent = (100 * CURRENT_TOTAL / GOAL).toFixed(1) + '% complete';
document.getElementById('remaining').textContent = format(Math.max(0, GOAL - CURRENT_TOTAL)) + ' to go!';
document.getElementById('fill').setAttribute('y', 194 - 176 * ratio);
document.getElementById('fill').setAttribute('height', 176 * ratio);
document.getElementById('progressFill').style.width = (ratio * 100) + '%';
document.getElementById('progress').setAttribute('aria-valuemax', GOAL);
document.getElementById('progress').setAttribute('aria-valuenow', CURRENT_TOTAL);
</script>
</body>
</html>
